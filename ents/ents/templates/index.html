{% extends "base_generic.html" %} 

{% block content %}

{% comment %} <p>exportform.html</p> {% endcomment %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
<style>
  /* keep dropdown rows and the closed box tall enough for the 56px thumbnails */
  .select2-results__option { min-height: 60px; display: flex; align-items: center; }
  .select2-selection--single { height: 60px !important; }
  .select2-selection--single .select2-selection__rendered { line-height: 60px !important; display: flex; align-items: center; }
  .select2-selection--single .select2-selection__arrow { height: 60px !important; }
</style>
<form action="{% url 'index' %}" method="post">
    {% csrf_token %}
    <h1> Enrichment Items</h1>
    {{ form.as_p }}
    <img id="image-1" src="" class="img-fluid" alt="..." >
    {% comment %} <input type="submit" value="Submit"> {% endcomment %}


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script>

    // shows the item's thumbnail (from data-thumb) next to its name in the dropdown
    function formatItemWithThumb(item) {
      if (!item.id) {
        return item.text;
      }
      var thumbUrl = $(item.element).data("thumb");
      if (!thumbUrl) {
        return item.text;
      }
      return $(
        '<span><img src="' + thumbUrl + '" style="height:56px;width:56px;object-fit:cover;border-radius:4px;margin-right:8px;vertical-align:middle;">' +
        item.text + '</span>'
      );
    }

    $("#id_items").select2({
      width: "100%",
      templateResult: formatItemWithThumb,
      templateSelection: formatItemWithThumb
    });

    // filter the dropdown by up to three search strings (an item must contain all of them)
    function runSearch() {
      var theDoSearch = $("#id_doSearch").prop("checked");

      $.ajax({
        url: "{% url 'ajax_load_searchstring_items' %}",
        data: {
          'theDoSearch': theDoSearch,
          'theSearchString': $("#id_searchString").val(),
          'theSearchString2': $("#id_searchString2").val(),
          'theSearchString3': $("#id_searchString3").val()
        },
        success: function (data) {
          $("#id_items").html(data).trigger("change");
          // the header line shows how many items are in the dropdown
          var countText = $("#id_items option").first().data("count-text");
          $("label[for=id_items]").text("Select Item (" + countText + "):");
        }
      });
    }

    $("#id_doSearch").change(runSearch);

    // editing a search string while filtering is on updates the list; Enter turns filtering on
    $("#id_searchString, #id_searchString2, #id_searchString3").on("change", function () {
      if ($("#id_doSearch").prop("checked")) { runSearch(); }
    }).on("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        $("#id_doSearch").prop("checked", true);
        runSearch();
      }
    });

    {% comment %} $("#id_searchString").change(function () {
      url = "{% url 'ajax_load_searchstring_items' %}"
      var theSearchString = $(this).val();  

      $.ajax({                       
        url: url,                    
        data: {
          'theSearchString': theSearchString     
        },
        success: function (data) {   
          $("#id_items").html(data);  
        }
      });

    }); {% endcomment %}

    $("#id_items").change(function () {
        url = "{% url 'ajax_get_image_url' %}"
        var theItem = $(this).val();

        $.ajax({
            url: url,
            data: {
                'theItem': theItem
            },
            success: function (data) {
                var theURL = data['theURL'];
                console.log('theURL: ' + theURL);
                $("#image-1").attr("src", theURL);
            }
            
        });
    });
  </script>
</form>

{% endblock %}
