{% extends "base_generic.html" %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
<style>
  /* long item names wrap instead of stretching the page */
  .select2-results__option { white-space: normal; overflow-wrap: anywhere; }
  .select2-selection--multiple .select2-selection__choice { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
  .select2-selection--multiple .select2-selection__choice__display { white-space: normal; text-overflow: clip; overflow: visible; }
</style>
<h1>Item &harr; Calendar Assignments</h1>

<h4>Look up an item's calendars</h4>
<select id="lookup-item" class="form-control" style="max-width:400px;">
  <option value="">Choose an item&hellip;</option>
  {% for item in form.fields.items.queryset %}
  <option value="{{ item.id }}">{{ item.name }}</option>
  {% endfor %}
</select>
<ul id="lookup-result" class="mt-2"></ul>

<hr>

<h4>Assign item(s) to calendar(s)</h4>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Assign</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
  // searchable, wrapping item list at about half the page width
  $("#id_items").select2({ width: "50%", placeholder: "Search and pick one or more items" });


  $("#lookup-item").change(function () {
    var itemId = $(this).val();
    var resultEl = $("#lookup-result");
    resultEl.empty();
    if (!itemId) { return; }
    $.ajax({
      url: "{% url 'zoo:item_ajax_asgs_for_item' %}",
      data: {'item_id': itemId},
      success: function (data) {
        if (!data.asgs.length) {
          resultEl.append("<li><em>Not assigned to any calendar yet.</em></li>");
          return;
        }
        data.asgs.forEach(function (name) {
          resultEl.append("<li>" + name + "</li>");
        });
      }
    });
  });
</script>
{% endblock %}
